<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ball Knowledge Central | Daily Gauntlet &amp; Infinite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    /* Self-contained dark theme & layout fallbacks so UI looks sharp even if Tailwind CDN is blocked */
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(circle at top, #18181b 0%, #09090b 100%) !important;
      color: #f4f4f5 !important;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .hidden { display: none !important; }

    /* Subtle basketball court lines background pattern */
    .court-bg {
      background-image:
        radial-gradient(circle at 50% 0%, rgba(249, 115, 22, 0.14) 0%, transparent 60%),
        linear-gradient(to right, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 100% 100%, 40px 40px, 40px 40px;
    }

    /* Core structural fallbacks when external CDN CSS is blocked */
    .app-shell { display: flex; flex-direction: column; min-height: 100vh; }
    .app-body-row { display: flex; flex-direction: column; flex: 1; min-height: 0; }
    @media (min-width: 768px) {
      .app-body-row { flex-direction: row; }
      .app-sidebar {
        width: 15rem;
        min-height: calc(100vh - 57px);
        border-right: 1px solid rgba(39, 39, 42, 0.85);
        border-bottom: none;
        flex-direction: column;
      }
    }
    .app-sidebar {
      background: rgba(9, 9, 11, 0.92);
      border-bottom: 1px solid rgba(39, 39, 42, 0.85);
    }

    @keyframes popIn {
      0% { transform: scale(0.95); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .animate-pop {
      animation: popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .animate-shake {
      animation: shake 0.38s ease-in-out;
    }

    /* Headshot container gradient backdrop */
    .player-stage {
      background: linear-gradient(180deg, rgba(39, 39, 42, 0.45) 0%, rgba(24, 24, 27, 0.96) 100%);
    }

    button { cursor: pointer; }
  </style>
</head>
<body class="court-bg app-shell flex flex-col min-h-screen selection:bg-orange-500 selection:text-white">

  <!-- Full-Width Top Header Extending Across the Entire Screen -->
  <header class="w-full border-b border-zinc-800/80 bg-zinc-950/80 backdrop-blur-md sticky top-0 z-40">
    <div class="w-full px-4 py-3.5 flex items-center justify-center">
      <div class="flex items-center justify-center text-center">
        <h1 class="text-lg sm:text-xl font-black tracking-tight text-white leading-none">Ball Knowledge Central</h1>
      </div>
    </div>
  </header>

  <!-- Below-Header Row: Left Sidebar + Main Workspace -->
  <div class="app-body-row flex-1 flex flex-col md:flex-row min-w-0">

    <!-- Left Game Switcher Sidebar (Starts below the top bar) -->
    <aside class="app-sidebar w-full md:w-60 bg-zinc-950/90 border-b md:border-b-0 md:border-r border-zinc-800/80 backdrop-blur-md flex flex-row md:flex-col justify-between px-4 py-3 md:p-4 shrink-0 z-30">
      <nav aria-label="Game Switcher" class="flex flex-row md:flex-col gap-1.5 flex-1 md:flex-initial">
        <div class="hidden md:block px-2 text-[10px] font-bold uppercase tracking-widest text-zinc-500 mb-1">
          Games
        </div>

        <!-- Active Tab: EBK -->
        <button
          type="button"
          id="sidebar-tab-ebk"
          onclick="selectSidebarGame('ebk')"
          class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl bg-orange-500/15 border border-orange-500/40 text-white font-bold text-sm shadow-sm transition-all"
        >
          <span class="w-7 h-7 rounded-lg bg-orange-500 text-white flex items-center justify-center shrink-0 shadow shadow-orange-500/30">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M6.5 6.5c3.5 3.5 3.5 7.5 0 11"></path>
              <path d="M17.5 6.5c-3.5 3.5-3.5 7.5 0 11"></path>
              <line x1="3" y1="12" x2="21" y2="12"></line>
            </svg>
          </span>
          <span class="tracking-wide">EBK</span>
          <span class="ml-auto hidden md:inline-block w-2 h-2 rounded-full bg-orange-400"></span>
        </button>

        <!-- Placeholder slot hint for future games -->
        <div class="hidden md:flex items-center gap-3 px-3.5 py-2.5 rounded-xl border border-dashed border-zinc-800/80 text-zinc-600 text-xs font-medium select-none">
          <span class="w-7 h-7 rounded-lg bg-zinc-900 border border-zinc-800 flex items-center justify-center text-zinc-600">+</span>
          <span>More games soon</span>
        </div>
      </nav>
