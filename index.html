<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ball Knowledge Central | Home</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(circle at top, #18181b 0%, #09090b 100%) !important;
      color: #f4f4f5 !important;
      min-height: 100vh;
    }
    .court-bg {
      background-image:
        radial-gradient(circle at 50% 0%, rgba(249, 115, 22, 0.14) 0%, transparent 60%),
        linear-gradient(to right, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 100% 100%, 40px 40px, 40px 40px;
    }
  </style>
</head>
<body class="court-bg flex flex-col min-h-screen selection:bg-orange-500 selection:text-white">

  <!-- Top Header -->
  <header class="w-full border-b border-zinc-800/80 bg-zinc-950/80 backdrop-blur-md sticky top-0 z-40">
    <div class="w-full px-4 py-3.5 flex items-center justify-center">
      <h1 class="text-lg sm:text-xl font-black tracking-tight text-white leading-none">Ball Knowledge Central</h1>
    </div>
  </header>

  <div class="flex-1 flex flex-col md:flex-row min-w-0">

    <!-- Left Sidebar -->
    <aside class="w-full md:w-60 bg-zinc-950/90 border-b md:border-b-0 md:border-r border-zinc-800/80 backdrop-blur-md flex flex-row md:flex-col justify-between px-4 py-3 md:p-4 shrink-0 z-30">
      <nav aria-label="Game Switcher" class="flex flex-row md:flex-col gap-1.5 flex-1 md:flex-initial">

        <!-- Active Tab: Home -->
        <a
          href="/nba-games/"
          class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl bg-orange-500/15 border border-orange-500/40 text-white font-bold text-sm shadow-sm transition-all"
        >
          <span class="w-7 h-7 rounded-lg bg-orange-500 text-white flex items-center justify-center shrink-0 shadow shadow-orange-500/30">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1v-9.5z" />
            </svg>
          </span>
          <span class="tracking-wide">Home</span>
          <span class="ml-auto hidden md:inline-block w-2 h-2 rounded-full bg-orange-400"></span>
        </a>

        <!-- EBK Tab (Links into /ebk/ folder) -->
        <a
          href="./ebk/"
          class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl border border-transparent hover:bg-zinc-900 hover:border-zinc-800 text-zinc-400 hover:text-white font-bold text-sm transition-all"
        >
          <span class="w-7 h-7 rounded-lg bg-zinc-900 border border-zinc-800 text-zinc-400 flex items-center justify-center shrink-0">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M6.5 6.5c3.5 3.5 3.5 7.5 0 11"></path>
              <path d="M17.5 6.5c-3.5 3.5-3.5 7.5 0 11"></path>
              <line x1="3" y1="12" x2="21" y2="12"></line>
            </svg>
          </span>
          <span class="tracking-wide">EBK</span>
        </a>
        <!-- Imposter Tab -->
        <a
          href="../imposter/"
          class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl border border-transparent hover:bg-zinc-900 hover:border-zinc-800 text-zinc-400 hover:text-white font-bold text-sm transition-all"
        >
          <span class="w-7 h-7 rounded-lg bg-zinc-900 border border-zinc-800 text-zinc-400 flex items-center justify-center shrink-0">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 3a6 6 0 00-6 6v3.586l-1.707 1.707A1 1 0 005 16h14a1 1 0 00.707-1.707L18 12.586V9a6 6 0 00-6-6z" />
              <circle cx="9.5" cy="10" r="1" fill="currentColor" />
              <circle cx="14.5" cy="10" r="1" fill="currentColor" />
            </svg>
          </span>
          <span class="tracking-wide">Imposter</span>
        </a>
      </nav>
    </aside>

    <!-- Homepage Main Content -->
    <main class="flex-1 max-w-3xl mx-auto px-6 py-12 flex flex-col items-center justify-center text-center">
      <h2 class="text-3xl sm:text-4xl font-black text-white tracking-tight mb-3">Welcome to Ball Knowledge Central</h2>
      <p class="text-sm sm:text-base text-zinc-400 max-w-lg mb-8">
        Think you know ball? Test yourself. Pick a game to get started.
      </p>

      <!-- Game Launch Card -->
      <a
        href="./ebk/"
        class="w-full max-w-md bg-zinc-900/90 hover:bg-zinc-900 border border-zinc-800 hover:border-orange-500/50 rounded-3xl p-6 text-left shadow-2xl transition-all group"
      >
        <div class="flex items-center justify-between mb-3">
          <span class="px-2.5 py-1 rounded-lg bg-orange-500/15 text-orange-400 border border-orange-500/30 text-xs font-extrabold uppercase tracking-wider">
            Featured Game
          </span>
          <span class="text-xs font-bold text-zinc-400 group-hover:text-orange-400 transition">Play Now →</span>
        </div>
        <h3 class="text-xl font-black text-white mb-1">EBK</h3>
        <p class="text-xs sm:text-sm text-zinc-400">
          Name the player based on the image. Play a Daily Gauntlet with global standings, or practice with Infinite mode.
        </p>
      </a>
    </main>

  </div>
</body>
</html>
